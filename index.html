<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Northern Survival</title>
    <link rel="stylesheet" href="src/style.css" />
    <!--
      Lets the game run without npm: the browser downloads Three.js from a CDN.
      When running with npm/Vite, Vite uses the installed copy instead.
      Keep this version in sync with "three" in package.json.
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud">
      <div id="help">WASD / arrows to move · 1–6 to pick an item · Space or click to use it · E to drink · scroll to zoom</div>
    </div>
    <div id="clock"></div>
    <div id="stats">
      <div class="stat" id="stat-health"><span>Health</span><div class="bar"><div class="fill"></div></div></div>
      <div class="stat" id="stat-hunger"><span>Hunger</span><div class="bar"><div class="fill"></div></div></div>
      <div class="stat" id="stat-thirst"><span>Thirst</span><div class="bar"><div class="fill"></div></div></div>
    </div>
    <div id="action">
      <div id="prompt" hidden></div>
      <div id="progress" hidden><div class="fill"></div></div>
    </div>
    <div id="toasts"></div>
    <div id="hotbar"></div>
    <div id="game-over" hidden>
      <div class="panel">
        <h1>You didn't make it</h1>
        <p id="survived"></p>
        <button id="restart">Try again</button>
      </div>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
